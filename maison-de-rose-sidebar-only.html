<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maison de Rose · Sidebar Widget</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');
:root{font-family:'DM Sans',sans-serif;color:#655958;background:#faf7f4}*{box-sizing:border-box}body{margin:0}.app{display:block;width:100%}.sidebar{width:100%;min-height:100vh;background:#fffdfb;border-right:1px solid #eee4df;padding:32px 18px;display:flex;flex-direction:column;gap:20px}.brand{padding:5px 13px 18px;border-bottom:1px solid #eee5e0}.brand h1{font:600 25px 'Playfair Display',serif;letter-spacing:-.6px;color:#8f6f73;margin:0}.brand p{font:italic 13px 'Playfair Display',serif;color:#b8a29f;margin:7px 0 0}.section-label{font-size:10px;letter-spacing:2.1px;color:#b9a6a0;padding:0 14px;text-transform:uppercase}.nav{display:flex;flex-direction:column;gap:5px}.item{display:flex;align-items:center;gap:12px;min-height:43px;border-radius:11px;padding:0 10px;color:#776b68;cursor:pointer;border:1px solid transparent;user-select:none}.item:hover{background:#faf3f0}.item.active{background:#f7e9e9;border-color:#f0dfe0;color:#916e77}.item.dragging{opacity:.35}.item.over{border-top:2px solid #bd949c}.grip{color:#cdbfba;font-size:14px;cursor:grab;letter-spacing:-3px}.symbol{width:24px;text-align:center;font-size:17px}.name{flex:1;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dots{background:none;border:0;color:#b7a29e;cursor:pointer;font-size:19px;padding:2px 5px}.add{background:transparent;border:1px dashed #e6d3d0;color:#a48186;border-radius:10px;padding:12px;text-align:left;cursor:pointer;font-size:13px;margin:0 5px}.add:hover{background:#faf0ef}.sidefoot{margin-top:auto;border-top:1px solid #eee5e0;padding:17px 12px 0;font:italic 12px 'Playfair Display',serif;color:#b9a5a0}.main{flex:1;padding:65px clamp(25px,6vw,100px);background:radial-gradient(ellipse at 85% 12%,#f9eeee,transparent 35%),#faf7f4}.eyebrow{color:#b59a9a;letter-spacing:3px;font-size:11px;text-transform:uppercase}.main h2{font:500 clamp(34px,5vw,58px) 'Playfair Display',serif;color:#8d6e73;margin:14px 0}.desc{font-size:14px;color:#9d8985;line-height:1.9;max-width:480px}.placeholder{margin-top:40px;border:1px solid #eddfd9;border-radius:18px;min-height:260px;background:#fffdfb;display:grid;place-items:center;text-align:center;padding:25px;color:#b7a5a0;font-size:13px}.placeholder span{font-size:30px;display:block;margin-bottom:12px}.modalback{position:fixed;inset:0;background:#3e30304d;display:none;align-items:center;justify-content:center;padding:20px}.modalback.show{display:flex}.modal{background:#fffdfb;border:1px solid #ecdeda;border-radius:18px;padding:26px;width:min(390px,100%);box-shadow:0 20px 70px #46302c26}.modal h3{font:500 25px 'Playfair Display',serif;color:#916f77;margin:0 0 20px}.modal label{display:block;font-size:12px;color:#917e7b;margin:15px 0 7px}.modal input,.modal select{width:100%;padding:12px;border:1px solid #e7d9d3;border-radius:9px;background:white;color:#695b59;font:inherit}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:24px}.btn{border:1px solid #e7d8d3;background:white;color:#8c7471;padding:10px 14px;border-radius:9px;cursor:pointer}.btn.primary{background:#b88f98;border-color:#b88f98;color:white}.btn.danger{margin-right:auto;color:#b06b74}.hint{font-size:11px;color:#b09b96;padding:0 10px;line-height:1.6}@media(max-width:680px){.sidebar{width:100%;padding:23px 12px}.brand{padding:5px 7px 17px}.brand h1{font-size:20px}.main{padding:45px 22px}.item{gap:5px;padding:0 5px}.symbol{width:20px}.name{font-size:11px}.grip{font-size:12px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><h1>Maison de Rose</h1><p>my little universe ♡</p></div><div class="section-label">My pages</div><nav class="nav" id="nav" aria-label="페이지 메뉴"></nav><button class="add" id="add">＋ &nbsp; New page</button><div class="hint">⋮⋮ 드래그하여 순서 변경<br>··· 메뉴에서 이름·아이콘·링크 수정</div><div class="sidefoot">A little space to bloom.</div></aside></div><div class="modalback" id="back"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h3 id="modalTitle">New page</h3><label for="pageName">Page name</label><input id="pageName" maxlength="45" placeholder="페이지 이름"><label for="pageIcon">Icon</label><select id="pageIcon"><option>🏠</option><option>🌷</option><option>🕊️</option><option>🌿</option><option>📚</option><option>🎓</option><option>💼</option><option>🎨</option><option>📖</option><option>✨</option><option>☕</option><option>🎀</option><option>🗓️</option><option>🧸</option><option>💌</option></select><label for="pageUrl">Notion page link (optional)</label><input id="pageUrl" type="url" placeholder="https://www.notion.so/..."><div class="actions"><button class="btn danger" id="delete" hidden>Delete</button><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="save">Save</button></div></div></div><script>
const KEY='maison-de-rose-sidebar-v1';const defaults=[['Home','🏠'],['Self-Care','🌷'],['Personal Growth','🌿'],['Academics','📚'],['Career','💼'],['Taste','🎨'],['Journal','📖']].map(([name,icon],i)=>({id:'default-'+i,name,icon}));let pages;try{pages=JSON.parse(localStorage.getItem(KEY))||defaults}catch{pages=defaults}if(!Array.isArray(pages)||!pages.length)pages=defaults;let active=pages[0].id,editing=null,dragged=null;const $=id=>document.getElementById(id);function persist(){localStorage.setItem(KEY,JSON.stringify(pages))}function render(){const nav=$('nav');nav.innerHTML='';pages.forEach(p=>{const el=document.createElement('div');el.className='item'+(p.id===active?' active':'');el.draggable=true;el.dataset.id=p.id;const grip=document.createElement('span');grip.className='grip';grip.textContent='⋮⋮';grip.title='드래그하여 순서 변경';const ico=document.createElement('span');ico.className='symbol';ico.textContent=p.icon;const name=document.createElement('span');name.className='name';name.textContent=p.name;const edit=document.createElement('button');edit.className='dots';edit.textContent='···';edit.title='페이지 편집';edit.setAttribute('aria-label',p.name+' 편집');edit.onclick=e=>{e.stopPropagation();openModal(p.id)};el.append(grip,ico,name,edit);el.onclick=()=>{active=p.id;render();if(p.url)window.open(p.url,'_blank','noopener,noreferrer')};el.ondragstart=e=>{dragged=p.id;el.classList.add('dragging');e.dataTransfer.effectAllowed='move'};el.ondragover=e=>{e.preventDefault();el.classList.add('over')};el.ondragleave=()=>el.classList.remove('over');el.ondrop=e=>{e.preventDefault();const from=pages.findIndex(x=>x.id===dragged),to=pages.findIndex(x=>x.id===p.id);if(from>=0&&to>=0&&from!==to){pages.splice(to,0,pages.splice(from,1)[0]);persist()}dragged=null;render()};el.ondragend=()=>{dragged=null;render()};nav.append(el)});const page=pages.find(p=>p.id===active)||pages[0]}function openModal(id=null){editing=id;const p=pages.find(x=>x.id===id);$('modalTitle').textContent=p?'Edit page':'New page';$('pageName').value=p?p.name:'';$('pageIcon').value=p?p.icon:'🌷';$('pageUrl').value=p?.url||'';$('delete').hidden=!p;$('back').classList.add('show');$('pageName').focus()}function closeModal(){$('back').classList.remove('show')} $('add').onclick=()=>openModal();$('cancel').onclick=closeModal;$('back').onclick=e=>{if(e.target===$('back'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('save').onclick=()=>{const name=$('pageName').value.trim();if(!name){$('pageName').focus();return}if(editing){const p=pages.find(x=>x.id===editing);if(p){p.name=name;p.icon=$('pageIcon').value;p.url=$('pageUrl').value.trim()}}else{const id='page-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);pages.push({id,name,icon:$('pageIcon').value,url:$('pageUrl').value.trim()});active=id}persist();closeModal();render()};$('delete').onclick=()=>{if(!editing)return;if(pages.length===1){alert('최소 한 개의 페이지는 필요해요.');return}if(!confirm('이 페이지를 삭제할까요?'))return;pages=pages.filter(x=>x.id!==editing);if(active===editing)active=pages[0].id;persist();closeModal();render()};render();
</script></body></html>
